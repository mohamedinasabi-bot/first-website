<!DOCTYPE html>
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Service Request</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>ICT SERVICE REQUEST</h1>
<form action="page2.html" method="get">
    <h2>Requests Informtion</h2>
    <p>Please Provide your Personal Informtion below</p>
    <div class="form">
    <label for="FirstName">FirstName</label>
    <input type="text" id="FirstName" name="FirstName" placeholder="Enter your full name" required>
    </div>
    <div class="form">
        <label for="Email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email Address" required>
    </div>
    <div class="form">
        <label for="Phone">PhoneNumber</label>
        <input type="tel" id="Phone" name="Phone" placeholder="Enter your PhoneNumber" required>
    </div>
    <div class="form">
        <label for="Department">Department</label>
        <select id="Department" name="Department">
            <option value="">Select your department</option>
            <option value="ICT">ICT</option>
            <option value="Finance">Finance</option>
            <option value="Human resource">Human resource</option>
            <option value="Marketing">Marketing</option>
            <option value="Other">Other</option>
        </select>
    </div>
    <button type="submit">NEXT</button>
    </form>
    
</form>
</body>
</html>
